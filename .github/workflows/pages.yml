name: Publicar aplicativo no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app-sao-gabriel/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Separar arquivos públicos do aplicativo
        run: |
          mkdir _site
          cp app-sao-gabriel/*.html app-sao-gabriel/*.js app-sao-gabriel/*.css app-sao-gabriel/*.png app-sao-gabriel/*.webmanifest _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
